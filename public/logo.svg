<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" width="200" height="48">
  <defs>
    <linearGradient id="logoHub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#dcdcd6" />
    </linearGradient>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(4, 4)">
    <rect width="40" height="40" rx="11" fill="#20201F" />

    <!-- Wheel rim -->
    <circle cx="20" cy="20" r="14" fill="none" stroke="#ffffff" stroke-width="1.8" opacity="0.9" />

    <!-- Spokes -->
    <line x1="20" y1="6" x2="20" y2="34" stroke="#ffffff" stroke-width="1.4" opacity="0.75" />
    <line x1="6" y1="20" x2="34" y2="20" stroke="#ffffff" stroke-width="1.4" opacity="0.75" />
    <line x1="10.1" y1="10.1" x2="29.9" y2="29.9" stroke="#ffffff" stroke-width="1.4" opacity="0.75" />
    <line x1="29.9" y1="10.1" x2="10.1" y2="29.9" stroke="#ffffff" stroke-width="1.4" opacity="0.75" />

    <!-- Center Hub -->
    <circle cx="20" cy="20" r="4.2" fill="url(#logoHub)" />
    <circle cx="20" cy="20" r="2" fill="#20201F" />
    <circle cx="20" cy="20" r="0.7" fill="#ffffff" />

    <!-- Pointer -->
    <polygon points="20,10.2 16.8,4.5 23.2,4.5" fill="#b7a7d9" stroke="#ffffff" stroke-width="0.8" />
  </g>

  <!-- Typography Wordmark -->
  <text x="56" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5" fill="#20201F">
    PickIt
  </text>
  <circle cx="128" cy="30" r="2.5" fill="#b7a7d9" />
</svg>
