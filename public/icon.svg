<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="hubGrad64" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#dcdcd6" />
    </linearGradient>
    <filter id="shadow64" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Dark Rounded Squircle Base -->
  <rect width="64" height="64" rx="16" fill="#20201F" filter="url(#shadow64)" />

  <!-- Outer Wheel Rim -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#ffffff" stroke-width="2.8" opacity="0.9" />

  <!-- Spokes -->
  <line x1="32" y1="10" x2="32" y2="54" stroke="#ffffff" stroke-width="2.2" opacity="0.75" />
  <line x1="10" y1="32" x2="54" y2="32" stroke="#ffffff" stroke-width="2.2" opacity="0.75" />
  <line x1="16.44" y1="16.44" x2="47.56" y2="47.56" stroke="#ffffff" stroke-width="2.2" opacity="0.75" />
  <line x1="47.56" y1="16.44" x2="16.44" y2="47.56" stroke="#ffffff" stroke-width="2.2" opacity="0.75" />

  <!-- Center Hub -->
  <circle cx="32" cy="32" r="6.8" fill="url(#hubGrad64)" />
  <circle cx="32" cy="32" r="3.2" fill="#20201F" />
  <circle cx="32" cy="32" r="1.2" fill="#ffffff" />

  <!-- Pointer Needle at 12 o'clock -->
  <polygon points="32,16.5 27,7.5 37,7.5" fill="#b7a7d9" stroke="#ffffff" stroke-width="1.2" />
  <circle cx="32" cy="7.5" r="1.5" fill="#ffffff" />
</svg>
